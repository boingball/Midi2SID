name: apply-popcorn-feedback

on:
  push:
    branches:
      - fix/popcorn-lead-release-and-ownership

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply release and lead-ownership fix
        run: python tools/apply_popcorn_feedback.py
      - name: Run unit tests
        run: python -m unittest -v
      - name: Reassemble supplied Popcorn MIDI
        run: |
          git fetch origin build/popcorn-pr2-prg --depth=1
          for n in 00 01 02 03 04 05 06 07; do
            git show FETCH_HEAD:build_input/chunk_${n}.b64
            printf '\n'
          done | base64 --decode > /tmp/popcorn.mid
          test "$(wc -c < /tmp/popcorn.mid)" -eq 21287
      - name: Build feedback PRG
        run: |
          python midi2sid.py /tmp/popcorn.mid Popcorn-Midi2SID-lead-fix.prg --title "POPCORN" --video pal --drums smart --filter off --feel tight
          test -s Popcorn-Midi2SID-lead-fix.prg
          python - <<'PY'
          from pathlib import Path
          data = Path('Popcorn-Midi2SID-lead-fix.prg').read_bytes()
          assert data[:2] == b'\x01\x08'
          print(f'PRG size: {len(data)} bytes')
          PY
      - name: Upload feedback PRG
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-lead-fix-prg
          path: Popcorn-Midi2SID-lead-fix.prg
          if-no-files-found: error
      - name: Commit tested fix
        run: |
          rm tools/apply_popcorn_feedback.py .github/workflows/apply-popcorn-feedback.yml
          git add sid_midi.py test_midi2sid.py tools/apply_popcorn_feedback.py .github/workflows/apply-popcorn-feedback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep melody release intact and reserve lead voice"
          git push origin HEAD:fix/popcorn-lead-release-and-ownership
